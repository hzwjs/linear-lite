spring:
  config:
    # IDEA 默认以 linear-lite-server 为工作目录，命令行从仓库根目录启动；两条路径都指向同一个根目录 .env。
    import: optional:file:.env,optional:file:../.env
  application:
    name: linear-lite-server
  # 与 SseEmitter 寿命一致；过小会导致 AsyncRequestTimeoutException，且易触发 SSE + JSON 全局异常处理的协商失败
  mvc:
    async:
      request-timeout: 30m
  servlet:
    multipart:
      # 文档迁移包含约 27MB 的 PDF；HTTP 层上限与文档附件业务上限保持一致。
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:linear_lite}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:true}
          socketFactory:
            port: ${MAIL_PORT:465}
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

server:
  port: ${SERVER_PORT:9080}
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: text/html,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml

# CORS：Vite 默认开发地址，多源用逗号分隔
cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# JWT
jwt:
  secret: ${JWT_SECRET:linear-lite-default-secret-change-in-production}
  # 授权令牌默认有效期为 30 天；部署环境可通过 JWT_EXPIRATION_MS 显式覆盖。
  expiration-ms: ${JWT_EXPIRATION_MS:2592000000}

# MCP 2026-07-28；默认关闭，部署环境显式开启并配置 Origin allowlist。
mcp:
  enabled: ${MCP_ENABLED:false}
  allowed-origins: ${MCP_ALLOWED_ORIGINS:}
  server-name: ${MCP_SERVER_NAME:linear-lite}
  server-version: ${MCP_SERVER_VERSION:0.1.0}
  tool-list-ttl-ms: ${MCP_TOOL_LIST_TTL_MS:300000}

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:Linear Lite}
  email:
    digest:
      cron: ${EMAIL_DIGEST_CRON:0 31 16 * * *}
#      cron: ${EMAIL_DIGEST_CRON:0 * * * * *}
      zone: ${EMAIL_DIGEST_ZONE:Asia/Shanghai}
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  storage:
    max-download-bytes: ${STORAGE_MAX_DOWNLOAD_BYTES:10485760}
    document-attachment-max-bytes: ${DOCUMENT_ATTACHMENT_MAX_BYTES:52428800}
    r2:
      enabled: ${R2_ENABLED:false}
      endpoint: ${R2_ENDPOINT:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
      region: ${R2_REGION:auto}
  semantic-search:
    enabled: ${SEMANTIC_SEARCH_ENABLED:false}
    qdrant-url: ${QDRANT_URL:http://127.0.0.1:6333}
    qdrant-api-key: ${QDRANT_API_KEY:}
    collection: ${QDRANT_COLLECTION:linear_lite_project_content}
    # 与 KB local 配置保持一致；密钥只能由部署环境注入，不写入仓库。
    embedding-base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    embedding-api-key: ${API_KEY:}
    embedding-model: ${LLM_EMBEDDING_MODEL:qwen3.7-text-embedding}
    dimension: ${EMBEDDING_DIMENSION:1024}
    max-results: ${SEMANTIC_SEARCH_MAX_RESULTS:100}
    min-score: ${SEMANTIC_SEARCH_MIN_SCORE:0.35}
    index-debounce-seconds: ${SEMANTIC_SEARCH_INDEX_DEBOUNCE_SECONDS:30}
    index-worker-batch-size: ${SEMANTIC_SEARCH_INDEX_WORKER_BATCH_SIZE:20}
    index-worker-delay-millis: ${SEMANTIC_SEARCH_INDEX_WORKER_DELAY_MILLIS:1000}
    # 首次全量回填需人工显式开启；默认只处理变更的任务和项目文档。
    initial-backfill-enabled: ${SEMANTIC_SEARCH_INITIAL_BACKFILL_ENABLED:false}
