
<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>HTML 验收</title><style>body{font-family:system-ui;margin:32px;background:#f8fafc;color:#172033}button{padding:12px 20px}li{margin:10px 0}</style></head><body><h1>HTML 文档验收</h1><p>点击按钮验证 JavaScript。</p><button id="counter">计数 0</button><ul id="checks"></ul><script>let count=0;document.querySelector("#counter").onclick=()=>{document.querySelector("#counter").textContent="计数 "+(++count)};function result(t){const n=document.createElement("li");n.textContent=t;document.querySelector("#checks").append(n)};try{parent.document.body;result("父页面：可访问")}catch{result("父页面：已隔离")};try{localStorage.getItem("jwt_token");result("存储：可访问")}catch{result("存储：已隔离")};fetch("http://127.0.0.1:19081/api/projects").then(()=>result("联网：可访问")).catch(()=>result("联网：已限制"));</script></body></html>
