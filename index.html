<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --shell-bg: #ffffff;
        --shell-sidebar-bg: #f8f8f8;
        --shell-border: #e8e8e8;
        --shell-muted: #f5f5f5;
        --shell-sidebar-width: 260px;
      }
      html,
      body,
      #app {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--shell-bg);
        color: #0d0d0d;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html.sidebar-hidden {
        --shell-sidebar-width: 40px;
      }
      #app:empty {
        position: relative;
        min-height: 100%;
        overflow: hidden;
        background: var(--shell-bg);
      }
      #app:empty::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--shell-sidebar-width);
        background:
          linear-gradient(var(--shell-muted), var(--shell-muted)) 16px 16px / 112px 18px no-repeat,
          linear-gradient(var(--shell-muted), var(--shell-muted)) 16px 64px / 168px 12px no-repeat,
          linear-gradient(var(--shell-muted), var(--shell-muted)) 16px 92px / 140px 12px no-repeat,
          var(--shell-sidebar-bg);
        border-right: 1px solid var(--shell-border);
      }
      #app:empty::after {
        content: "";
        position: absolute;
        inset: 8px 12px 8px calc(var(--shell-sidebar-width) + 12px);
        border: 1px solid var(--shell-border);
        border-radius: 6px;
        background:
          linear-gradient(var(--shell-muted), var(--shell-muted)) 16px 14px / 180px 14px no-repeat,
          linear-gradient(var(--shell-muted), var(--shell-muted)) 16px 52px / calc(100% - 32px) 1px no-repeat,
          linear-gradient(var(--shell-muted), var(--shell-muted)) 16px 76px / calc(100% - 32px) 32px no-repeat,
          linear-gradient(var(--shell-muted), var(--shell-muted)) 16px 116px / calc(100% - 32px) 32px no-repeat,
          #ffffff;
      }
    </style>
    <script>
      performance.mark("appStart")
      try {
        if (localStorage.getItem("linear-lite.sidebarHidden") === "1") {
          document.documentElement.classList.add("sidebar-hidden")
        }
        if (localStorage.getItem("linear_lite_jwt") === null) {
          document.documentElement.classList.add("logged-out")
        }
      } catch {}
    </script>
    <title>linear-lite</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
